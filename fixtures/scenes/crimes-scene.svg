<svg xmlns="http://www.w3.org/2000/svg" width="640" height="480" viewBox="0 0 640 480">
  <!-- provenote fixture 3 base scene: a constructed scene used to build the
       "same badge, different crimes" pair — one copy re-encoded by an ordinary,
       non-malicious tool after signing, one copy with a single deliberately
       altered content byte after signing. Both derive from THIS one signed
       file so the "same badge" comparison is exact. -->
  <defs>
    <linearGradient id="g3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#efe6da"/>
      <stop offset="1" stop-color="#c7b8a3"/>
    </linearGradient>
  </defs>
  <rect width="640" height="480" fill="url(#g3)"/>
  <rect x="80" y="80" width="480" height="320" fill="none" stroke="#2b2320" stroke-width="6"/>
  <circle cx="220" cy="240" r="70" fill="#7a4706"/>
  <rect x="340" y="170" width="140" height="140" fill="#41236d"/>
  <polygon points="220,140 260,220 180,220" fill="#83334c"/>
</svg>
